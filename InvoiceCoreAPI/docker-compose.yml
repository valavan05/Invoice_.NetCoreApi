services:
  invoice-api:
    container_name: invoice-api-container
 
    build:
      context: .
      dockerfile: Dockerfile
 
    image: invoicecoreapi:latest
 
    ports:
      - "5002:8080"
 
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}